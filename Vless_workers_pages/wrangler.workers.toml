# Workers deploy config: npx wrangler deploy -c wrangler.workers.toml
# پیکربندی دپلوی Workers: npx wrangler deploy -c wrangler.workers.toml
name = "vle-node-panel"
main = "_worker.js"
compatibility_date = "2025-01-01"

# Runtime region: run in the Cloudflare data center closest to Azure West Europe.
# ریجن اجرا: نزدیک‌ترین دیتاسنتر کلادفلر به Azure West Europe.
[placement]
region = "azure:westeurope"
